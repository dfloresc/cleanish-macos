appId: com.cleanish.app
productName: Cleanish
directories:
  buildResources: resources
files:
  - out/**/*
  - "!**/.vscode/*"
  - "!src/*"
  - "!electron.vite.config.{js,ts,mjs,cjs}"
  - "!{.eslintignore,.eslintrc.cjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}"
  - "!{.env,.env.*,.npmrc,package-lock.json}"
  - "!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}"
mac:
  entitlementsInherit: build/entitlements.mac.plist
  # Ad-hoc signature: there is no Developer ID, but the bundle stays sealed so downloads are not reported as damaged.
  identity: "-"
  # Hardened runtime with an ad-hoc signature rejects the pre-signed Electron frameworks.
  hardenedRuntime: false
  category: public.app-category.utilities
  target:
    - dmg
    - zip
  artifactName: ${name}-${version}-${arch}.${ext}
npmRebuild: false
publish: null
