name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Build and publish the macOS release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Check that the tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Package for Apple Silicon and Intel
        run: npm run dist -- --arm64 --x64 --publish never

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          cat > release-notes.md <<EOF
          ## Downloads

          - **Apple Silicon (M1 and newer):** cleanish-${version}-arm64.dmg
          - **Intel:** cleanish-${version}-x64.dmg

          The .zip files contain the same app without the disk image.

          Cleanish is not signed with an Apple Developer ID or notarized. macOS blocks it the first time you open it: go to **System Settings → Privacy & Security** and click **Open Anyway**.
          EOF
          gh release create "$GITHUB_REF_NAME" dist/*.dmg dist/*.zip \
            --title "Cleanish $GITHUB_REF_NAME" \
            --notes-file release-notes.md
